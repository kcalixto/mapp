<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — CCA Frei Tito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,300&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:  #F5F0E8;
      --white:  #FFFFFF;
      --brick:  #7C2D2D;
      --ember:  #C4622D;
      --bark:   #3D2B1F;
      --ash:    #8A7E74;
      --bone:   #E8DFD1;
      --smoke:  #D4C9BA;
      --shadow: rgba(61,43,31,0.08);
    }

    body {
      background: var(--cream);
      background-image:
        radial-gradient(circle at 10% 90%, rgba(196,98,45,0.05) 0%, transparent 50%),
        radial-gradient(circle at 90% 10%, rgba(124,45,45,0.05) 0%, transparent 50%);
      font-family: 'Jost', system-ui, sans-serif;
      color: var(--bark);
      min-height: 100vh;
    }

    /* Layout */
    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header-eyebrow {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ash);
      margin-bottom: 0.5rem;
    }
    .header-title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--brick);
      line-height: 1;
      margin-bottom: 0.75rem;
    }
    .header-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }
    .header-divider::before,
    .header-divider::after {
      content: '';
      display: block;
      height: 1px;
      width: 3rem;
      background: var(--smoke);
    }
    .header-subtitle {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ash);
    }

    /* Calendar card */
    .calendar-card {
      background: var(--white);
      border-radius: 12px;
      border: 1px solid var(--bone);
      box-shadow: 0 4px 24px var(--shadow), 0 1px 4px var(--shadow);
      overflow: hidden;
    }
    .calendar-top-bar {
      height: 4px;
      background: linear-gradient(90deg, var(--brick), var(--ember), var(--brick));
    }

    /* Month navigation */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--bone);
    }
    .month-label {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 1.125rem;
      font-weight: 500;
      color: var(--brick);
      text-align: center;
      flex: 1;
    }
    .nav-btn {
      background: none;
      border: 1.5px solid var(--smoke);
      border-radius: 6px;
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ash);
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .nav-btn:hover {
      border-color: var(--brick);
      color: var(--brick);
      background: rgba(124,45,45,0.04);
    }
    .nav-btn svg { width: 14px; height: 14px; }

    /* Day headers */
    .day-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--cream);
      border-bottom: 1px solid var(--bone);
    }
    .day-header {
      padding: 0.5rem 0;
      text-align: center;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ash);
    }
    .day-header.weekend { color: var(--ember); }

    /* Calendar grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 0.5rem;
      gap: 0.25rem;
    }
    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 0.8125rem;
      font-weight: 400;
      color: var(--bark);
      cursor: default;
      transition: background 0.12s;
      position: relative;
      user-select: none;
    }
    .day-cell.empty {
      pointer-events: none;
    }
    .day-cell.other-month {
      color: var(--smoke);
    }
    .day-cell.today {
      font-weight: 600;
      color: var(--brick);
    }
    .day-cell.today::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background: var(--brick);
      border-radius: 50%;
    }
    .day-cell.has-reservations {
      background: rgba(124,45,45,0.08);
      color: var(--brick);
      font-weight: 600;
      cursor: pointer;
    }
    .day-cell.has-reservations:hover {
      background: rgba(124,45,45,0.15);
    }
    .day-cell.has-reservations .dot-count {
      position: absolute;
      top: 3px;
      right: 4px;
      font-size: 0.5rem;
      background: var(--brick);
      color: #fff;
      border-radius: 999px;
      padding: 0 3px;
      line-height: 1.4;
      font-weight: 600;
    }

    /* Loading / empty state */
    .state-msg {
      padding: 3rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--ash);
    }

    /* Modal overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(61,43,31,0.4);
      backdrop-filter: blur(2px);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open {
      display: flex;
      animation: fadeOverlay 0.2s ease;
    }
    @keyframes fadeOverlay {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .modal {
      background: var(--white);
      border-radius: 12px;
      border: 1px solid var(--bone);
      box-shadow: 0 20px 60px rgba(61,43,31,0.2);
      width: 100%;
      max-width: 360px;
      overflow: hidden;
      animation: slideModal 0.2s ease;
    }
    @keyframes slideModal {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-bar {
      height: 4px;
      background: linear-gradient(90deg, var(--brick), var(--ember));
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--bone);
    }
    .modal-title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 1rem;
      font-weight: 500;
      color: var(--brick);
    }
    .modal-close {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ash);
      padding: 0.25rem;
      border-radius: 4px;
      display: flex;
      transition: color 0.1s;
    }
    .modal-close:hover { color: var(--brick); }
    .modal-close svg { width: 16px; height: 16px; }
    .modal-body {
      padding: 1rem 1.25rem 1.25rem;
      max-height: 60vh;
      overflow-y: auto;
    }
    .reservation-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.625rem 0;
      border-bottom: 1px solid var(--bone);
    }
    .reservation-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .reservation-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--brick);
      margin-top: 5px;
      flex-shrink: 0;
    }
    .reservation-name {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--bark);
    }
    .reservation-time {
      font-size: 0.75rem;
      color: var(--ash);
      margin-top: 1px;
    }

    /* Legend */
    .legend {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0.875rem 1.25rem;
      border-top: 1px solid var(--bone);
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.7rem;
      color: var(--ash);
      letter-spacing: 0.05em;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: rgba(124,45,45,0.12);
      border: 1.5px solid var(--brick);
    }
    .legend-dot.today {
      background: transparent;
      border: 1.5px solid var(--brick);
      position: relative;
    }
  </style>
</head>
<body>

  <div class="page">
    <div class="header">
      <p class="header-eyebrow">Painel Administrativo</p>
      <h1 class="header-title">CCA Frei Tito</h1>
      <div class="header-divider">
        <span class="header-subtitle">Agenda de Reservas</span>
      </div>
    </div>

    <div class="calendar-card">
      <div class="calendar-top-bar"></div>

      <div class="month-nav">
        <button class="nav-btn" id="prevBtn" aria-label="Mês anterior">
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <span class="month-label" id="monthLabel"></span>
        <button class="nav-btn" id="nextBtn" aria-label="Próximo mês">
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>

      <div class="day-headers">
        <div class="day-header weekend">Dom</div>
        <div class="day-header">Seg</div>
        <div class="day-header">Ter</div>
        <div class="day-header">Qua</div>
        <div class="day-header">Qui</div>
        <div class="day-header">Sex</div>
        <div class="day-header weekend">Sáb</div>
      </div>

      <div id="calendarGrid" class="calendar-grid">
        <div class="state-msg">Carregando reservas...</div>
      </div>

      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot"></div>
          <span>Reservado</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot today"></div>
          <span>Hoje</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-bar"></div>
      <div class="modal-header">
        <span class="modal-title" id="modalTitle"></span>
        <button class="modal-close" id="modalClose" aria-label="Fechar">
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const MONTHS_PT = [
      'Janeiro','Fevereiro','Março','Abril','Maio','Junho',
      'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'
    ];

    let currentYear  = new Date().getFullYear();
    let currentMonth = new Date().getMonth(); // 0-based
    let reservationsByDate = {};

    function formatDateISO(year, month, day) {
      return `${year}-${String(month + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    }

    function formatDateBR(isoDate) {
      const [year, month, day] = isoDate.split('-');
      return `${day}/${month}/${year}`;
    }

    function formatTime(isoString) {
      const d = new Date(isoString);
      return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    async function loadReservations() {
      try {
        const res = await fetch(`${window.CONFIG.apiUrl}/reservations`);
        if (!res.ok) throw new Error('Failed to fetch');
        const items = await res.json();

        reservationsByDate = {};
        for (const item of items) {
          if (!reservationsByDate[item.date]) {
            reservationsByDate[item.date] = [];
          }
          reservationsByDate[item.date].push(item);
        }
      } catch (e) {
        console.error('Error loading reservations:', e);
        document.getElementById('calendarGrid').innerHTML =
          '<div class="state-msg">Erro ao carregar reservas. Tente recarregar a página.</div>';
        return;
      }
      renderCalendar();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const monthLabel = document.getElementById('monthLabel');

      monthLabel.textContent = `${MONTHS_PT[currentMonth]} ${currentYear}`;

      const today = new Date();
      const todayISO = formatDateISO(today.getFullYear(), today.getMonth(), today.getDate());

      const firstDay = new Date(currentYear, currentMonth, 1).getDay(); // 0=Sun
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

      grid.innerHTML = '';

      // Leading empty cells
      for (let i = 0; i < firstDay; i++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell empty';
        grid.appendChild(cell);
      }

      // Day cells
      for (let d = 1; d <= daysInMonth; d++) {
        const isoDate = formatDateISO(currentYear, currentMonth, d);
        const reservations = reservationsByDate[isoDate] || [];
        const isToday = isoDate === todayISO;

        const cell = document.createElement('div');
        cell.className = 'day-cell';
        if (isToday) cell.classList.add('today');

        if (reservations.length > 0) {
          cell.classList.add('has-reservations');
          const countBadge = document.createElement('span');
          countBadge.className = 'dot-count';
          countBadge.textContent = reservations.length;
          cell.appendChild(countBadge);
          cell.addEventListener('click', () => openModal(isoDate, reservations));
          cell.setAttribute('role', 'button');
          cell.setAttribute('tabindex', '0');
          cell.setAttribute('aria-label', `${d} de ${MONTHS_PT[currentMonth]}: ${reservations.length} reserva(s)`);
          cell.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') openModal(isoDate, reservations);
          });
        }

        const num = document.createElement('span');
        num.textContent = d;
        cell.insertBefore(num, cell.firstChild);
        grid.appendChild(cell);
      }
    }

    function openModal(isoDate, reservations) {
      const overlay = document.getElementById('modalOverlay');
      const title   = document.getElementById('modalTitle');
      const body    = document.getElementById('modalBody');

      title.textContent = formatDateBR(isoDate);
      body.innerHTML = '';

      for (const r of reservations) {
        const item = document.createElement('div');
        item.className = 'reservation-item';
        item.innerHTML = `
          <div class="reservation-dot"></div>
          <div>
            <div class="reservation-name">${escapeHtml(r.name)}</div>
            <div class="reservation-time">Solicitado às ${formatTime(r.createdAt)}</div>
          </div>
        `;
        body.appendChild(item);
      }

      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    });

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    loadReservations();
  </script>
</body>
</html>

service: cca-form
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: sa-east-1
  environment:
    TABLE_NAME: !Ref ReservationsTable
  deploymentBucket:
    name: kcalixto-serverless-framework
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
          Resource: !GetAtt ReservationsTable.Arn

package:
  patterns:
    - '!frontend/**'
    - '!.github/**'
    - '!docs/**'
    - '!*.md'

functions:
  createReservation:
    handler: src/createReservation.handler
    events:
      - http:
          path: reservations
          method: post
          cors: true
  getReservations:
    handler: src/getReservations.handler
    events:
      - http:
          path: reservations
          method: get
          cors: true

resources:
  Resources:
    ReservationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: cca-reservations-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

    FrontendBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: cca-frei-tito-frontend-${sls:stage}
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false

    FrontendBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref FrontendBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${FrontendBucket.Arn}/*'

  Outputs:
    FrontendBucketName:
      Value: !Ref FrontendBucket
    WebsiteURL:
      Value: !GetAtt FrontendBucket.WebsiteURL

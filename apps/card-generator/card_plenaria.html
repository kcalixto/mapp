<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date Image Exporter</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        background-color: #f4f4f9;
      }

      .controls {
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }

      /* Responsive Canvas Container */
      .canvas-container {
        width: 100%;
        max-width: 600px; /* Limits visual size on desktop */
        border: 2px solid #ddd;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      canvas {
        width: 100%; /* Scales the 1280px canvas to fit the container */
        height: auto; /* Maintains 1:1 aspect ratio */
        display: block;
      }

      button {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }

      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <input type="date" id="datePicker" />
      <button id="exportBtn">Exportar Imagem Atualizada</button>
    </div>

    <div class="canvas-container">
      <canvas id="mainCanvas" width="1280" height="1280"></canvas>
    </div>

    <script>
      const canvas = document.getElementById("mainCanvas");
      const ctx = canvas.getContext("2d");
      const datePicker = document.getElementById("datePicker");
      const d = new Date();
      d.setDate(d.getDate() + ((7 - d.getDay()) % 7) || 7);
      datePicker.valueAsDate = d;
      const exportBtn = document.getElementById("exportBtn");

      // --- CONFIGURATION ---
      const TEXT_X = 413; // Horizontal center (1280 / 2)
      const TEXT_Y = 843; // Change this to your "specific place"
      const FONT_SIZE = 78;
      const IMAGE_SRC =
        "https://card-plenaria-up-webpage.s3.sa-east-1.amazonaws.com/card_template.png"; // Replace with your image path

      const img = new Image();
      img.crossOrigin = "anonymous"; // Needed if using external URLs
      img.src = IMAGE_SRC;

      // Ensure font is loaded before drawing
      document.fonts.load('10pt "Bebas Neue"').then(render);

      img.onload = render;
      datePicker.oninput = render;

      function render() {
        // 1. Draw Background Image
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, 1280, 1280);

        // 2. Draw Date Text
        if (datePicker.value) {
          // Formatting the date (Optional: change to your preferred format)
          const dateParts = datePicker.value.split("-");
          const formattedDate = `${dateParts[2]}/${dateParts[1]}`;

          ctx.font = `${FONT_SIZE}px 'Bebas Neue'`;
          ctx.color = "black";
          // ctx.fillStyle = "black";
          ctx.textAlign = "center";

          ctx.fillText(formattedDate, TEXT_X, TEXT_Y);
        }
      }

      // 3. Export Functionality
      exportBtn.onclick = async () => {
        // 1. Convert canvas to a Blob (File object)
        const link = document.createElement("a");
        link.download = `exported-date-${datePicker.value || "image"}.png`;
        link.href = canvas.toDataURL("image/png", 1.0);
        link.click();

        canvas.toBlob(async (blob) => {
          const file = new File([blob], `card_${datePicker.value}.png`, {
            type: "image/png",
          });

          // 2. Check if the device supports the Share API (iPhone/Android)
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: "Card Export",
                text: "Here is your generated card!",
              });
            } catch (err) {
              console.log("User cancelled or share failed", err);
            }
          } else {
            // 3. Desktop Fallback: Standard Download
            const link = document.createElement("a");
            link.download = `card_${datePicker.value}.png`;
            link.href = canvas.toDataURL("image/png", 1.0);
            link.click();
          }
        }, "image/png");
      };
    </script>
  </body>
</html>

service: mapp-apps
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: sa-east-1
  stage: prod
  deploymentBucket:
    name: kcalixto-serverless-framework
  environment:
    TABLE_NAME: !Ref ReservationsTable
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
          Resource: !GetAtt ReservationsTable.Arn

plugins:
  - serverless-s3-sync

package:
  patterns:
    - '!**'
    - 'cca-form/src/**'

custom:
  s3Sync:
    # msg-template: Vite build output (run `npm run build` in msg-template first)
    - bucketName: wpp-template-${sls:stage}
      localDir: msg-template/dist
      deleteRemoved: true
      defaultContentType: text/html
    # bilhete-unico: static HTML + JS, served as-is
    - bucketName: bilhete-unico-static-site-kcalixto
      localDir: bilhete-unico
      deleteRemoved: true
      params:
        - '*.html':
            ContentType: text/html
            CacheControl: no-cache
    # card-generator: single static HTML. Bucket pre-exists (created outside
    # CloudFormation), so it is synced but not declared under resources.
    - bucketName: card-plenaria-up-webpage
      localDir: card-generator
      deleteRemoved: true
      params:
        - '*.html':
            ContentType: text/html
            CacheControl: no-cache
    # cca-form frontend: config.js is rewritten with the real API URL by CI
    # after deploy (see .github/workflows/deploy-apps.yml)
    - bucketName: cca-frei-tito-frontend-${sls:stage}
      localDir: cca-form/frontend
      deleteRemoved: true
      params:
        - '*.html':
            ContentType: text/html
            CacheControl: max-age=3600

functions:
  createReservation:
    handler: cca-form/src/createReservation.handler
    events:
      - http:
          path: reservations
          method: post
          cors: true
  getReservations:
    handler: cca-form/src/getReservations.handler
    events:
      - http:
          path: reservations
          method: get
          cors: true

resources:
  Resources:
    ReservationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: cca-reservations-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

    WppTemplateBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: wpp-template-${sls:stage}
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false

    WppTemplateBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WppTemplateBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${WppTemplateBucket.Arn}/*'

    BilheteUnicoBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: bilhete-unico-static-site-kcalixto
        WebsiteConfiguration:
          IndexDocument: bilheteunico.html
          ErrorDocument: bilheteunico.html
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false

    BilheteUnicoBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref BilheteUnicoBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${BilheteUnicoBucket.Arn}/*'

    CcaFrontendBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: cca-frei-tito-frontend-${sls:stage}
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false

    CcaFrontendBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref CcaFrontendBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${CcaFrontendBucket.Arn}/*'

  Outputs:
    WppTemplateWebsiteURL:
      Value: !GetAtt WppTemplateBucket.WebsiteURL
    BilheteUnicoWebsiteURL:
      Value: !GetAtt BilheteUnicoBucket.WebsiteURL
    CcaFrontendBucketName:
      Value: !Ref CcaFrontendBucket
    CcaFrontendWebsiteURL:
      Value: !GetAtt CcaFrontendBucket.WebsiteURL

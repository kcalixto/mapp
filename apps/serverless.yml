service: mapp-apps
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: sa-east-1
  stage: prod
  deploymentBucket:
    name: kcalixto-serverless-framework
  environment:
    TABLE_NAME: !Ref ReservationsTable
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
          Resource: !GetAtt ReservationsTable.Arn

plugins:
  - serverless-s3-sync

package:
  patterns:
    - '!**'
    - 'cca-form/src/**'

custom:
  bucketName:
    msgTemplate: mapp-wpp-template-${sls:stage}
    cardGenerator: mapp-card-generator-${sls:stage}
    bilheteUnico: mapp-bilhete-unico-${sls:stage}

  s3Sync:
    # msg-template: Vite build output (run `npm run build` in msg-template first)
    - bucketName: ${self:custom.bucketName.msgTemplate}
      localDir: msg-template/dist
      deleteRemoved: true
      defaultContentType: text/html
      
    # bilhete-unico: static HTML + JS, served as-is
    - bucketName: ${self:custom.bucketName.bilheteUnico}
      localDir: bilhete-unico
      deleteRemoved: true
      params:
        - '*.html':
            ContentType: text/html
            CacheControl: no-cache

    # card-generator: single static HTML.
    - bucketName: ${self:custom.bucketName.cardGenerator}
      localDir: card-generator
      deleteRemoved: true
      params:
        - '*.html':
            ContentType: text/html
            CacheControl: no-cache

resources:
  Resources:
    MsgTemplateBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.bucketName.msgTemplate}
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false

    MsgTemplateBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref MsgTemplateBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${MsgTemplateBucket.Arn}/*'

    CardGeneratorBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.bucketName.cardGenerator}
        WebsiteConfiguration:
          IndexDocument: card_plenaria.html
          ErrorDocument: card_plenaria.html
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false

    CardGeneratorBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref CardGeneratorBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${CardGeneratorBucket.Arn}/*'

    BilheteUnicoBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.bucketName.bilheteUnico}
        WebsiteConfiguration:
          IndexDocument: bilheteunico.html
          ErrorDocument: bilheteunico.html
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false

    BilheteUnicoBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref BilheteUnicoBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${BilheteUnicoBucket.Arn}/*'

  Outputs:
    MsgTemplateWebsiteURL:
      Value: !GetAtt MsgTemplateBucket.WebsiteURL
    BilheteUnicoWebsiteURL:
      Value: !GetAtt BilheteUnicoBucket.WebsiteURL

name: Deploy apps

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/deploy-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            apps/package-lock.json
            apps/msg-template/package-lock.json

      - name: Install deploy tooling (serverless v3)
        run: npm ci

      - name: Install msg-template dependencies
        run: npm ci
        working-directory: apps/msg-template

      - name: Test msg-template
        run: npm test
        working-directory: apps/msg-template

      - name: Build msg-template
        run: npm run build
        working-directory: apps/msg-template

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Deploy unified stack
        run: npx serverless deploy --stage prod --verbose

      - name: Point cca-form frontend at the deployed API
        run: |
          API_URL=$(npx serverless info --stage prod --verbose | grep "ServiceEndpoint:" | awk '{print $2}')
          echo "Captured API URL: ${API_URL}"
          echo "window.CONFIG = { apiUrl: '${API_URL}' };" > cca-form/frontend/config.js
          aws s3 cp cca-form/frontend/config.js s3://cca-frei-tito-frontend-prod/config.js --cache-control no-cache
